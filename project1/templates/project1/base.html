{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
            Project 1
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{% static 'project1/style.css' %}"
    >

    <link
        rel="stylesheet"
        href="{% static 'navbar.css' %}"
    >

    {% endblock %}
</head>

<body>

    {% include "shared/navbar.html" %}

    {% block content %}
    {% endblock %}

    {% block script %}
    {% endblock %}

</body>

</html>
